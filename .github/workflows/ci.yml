name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: ruby script/check_prose.rb
      - run: uv run python -m script.check_layers
      - run: uv run pytest --cov --cov-report=term-missing

      # Needs nothing downloaded. The annotations and every cited paragraph are
      # committed under evidence/, so this recomputes each published number and
      # re-resolves each citation against the source text it quotes.
      - run: uv run python -m script.validate_evidence
