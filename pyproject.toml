[project]
name = "pathquery"
version = "0.1.0"
description = "Multi-hop evidence retrieval whose every citation is a verified byte range in the source, not a claim about one."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rajeev Chaurasia", email = "rajeevchaurasia.dev@gmail.com" }]
dependencies = [
    "bm25s>=0.2",
    "faiss-cpu>=1.9",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "sentence-transformers>=3.0",
    "typer>=0.12",
]

[project.scripts]
pathquery = "pathquery.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathquery"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "evaluation", "script"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pathquery", "evaluation", "script", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "script", "evaluation"]

[[tool.mypy.overrides]]
# faiss is a SWIG extension and bm25s ships no stubs; the sentence-transformers
# stubs are partial rather than absent.
module = ["faiss", "bm25s", "bm25s.*", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/faiss is a directory rather than a marker because pytest imports every
# test module while collecting, so a marker would still pull torch into the
# faiss process and abort it. script/test.sh runs the two halves.

[tool.coverage.run]
source = ["src/pathquery"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
