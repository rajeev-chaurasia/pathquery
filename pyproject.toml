[project]
name = "pathquery"
version = "0.1.0"
description = "Multi-hop evidence retrieval whose every citation is a verified byte range in the source, not a claim about one."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Rajeev Chaurasia", email = "rajeevchaurasia.dev@gmail.com" }]
dependencies = [
    "bm25s>=0.2",
    "numpy>=2.0",
    "pyarrow>=17.0",
    "pydantic>=2.8",
    "typer>=0.12",
]

[project.scripts]
pathquery = "pathquery.cli:app"

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pathquery"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "script"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["pathquery", "script", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "script"]

[[tool.mypy.overrides]]
# bm25s and pyarrow ship no py.typed marker.
module = ["bm25s", "bm25s.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/pathquery"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]
